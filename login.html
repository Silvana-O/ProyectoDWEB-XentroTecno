<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar | Xentro Tecno</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100" data-page="login">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    <span class="brand-mark">X</span> Xentro Tecno
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Mostrar navegación"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" data-page="inicio" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" data-page="catalogo" href="catalogo.html">
                                Catálogo
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" data-page="carrito" href="carrito.html">
                                Carrito
                                <span id="contadorCarrito" class="badge rounded-pill bg-warning text-dark">
                                    0
                                </span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" data-page="perfil" href="perfil.html">
                                Mi perfil
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" data-page="admin" href="admin.html">
                                Administración
                            </a>
                        </li>
                    </ul>

                    <a href="login.html" class="btn btn-outline-light btn-sm">
                        Ingresar
                    </a>

                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">

        <section class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-6">

                    <div class="card shadow-sm border-0">

                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-4">
                                <span class="brand-mark">X</span>

                                <h1 class="h3 fw-bold mt-3">
                                    Bienvenido a Xentro Tecno
                                </h1>

                                <p class="text-muted mb-0">
                                    Inicia sesión o crea una cuenta para continuar.
                                </p>
                            </div>

                            <!-- Pestañas -->
                            <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">

                                <li class="nav-item" role="presentation">
                                    <button
                                        class="nav-link active w-100"
                                        id="login-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#login"
                                        type="button"
                                        role="tab"
                                    >
                                        Iniciar sesión
                                    </button>
                                </li>

                                <li class="nav-item" role="presentation">
                                    <button
                                        class="nav-link w-100"
                                        id="register-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#register"
                                        type="button"
                                        role="tab"
                                    >
                                        Registrarse
                                    </button>
                                </li>

                            </ul>

                            <div class="tab-content">

                                <!-- INICIO DE SESIÓN -->
                                <div
                                    class="tab-pane fade show active"
                                    id="login"
                                    role="tabpanel"
                                >

                                    <form id="formLogin">

                                        <div class="mb-3">
                                            <label for="loginEmail" class="form-label">
                                                Correo electrónico
                                            </label>

                                            <input
                                                type="email"
                                                class="form-control"
                                                id="loginEmail"
                                                required
                                            >
                                        </div>

                                        <div class="mb-3">
                                            <label for="loginPassword" class="form-label">
                                                Contraseña
                                            </label>

                                            <input
                                                type="password"
                                                class="form-control"
                                                id="loginPassword"
                                                required
                                            >
                                        </div>

                                        <button
                                            type="submit"
                                            class="btn btn-primary w-100"
                                        >
                                            Iniciar sesión
                                        </button>

                                    </form>

                                </div>

                                <!-- REGISTRO -->
                                <div
                                    class="tab-pane fade"
                                    id="register"
                                    role="tabpanel"
                                >

                                    <form id="formRegistro">

                                        <div class="row">

                                            <div class="col-md-6 mb-3">
                                                <label for="registerNombre" class="form-label">
                                                    Nombre
                                                </label>

                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    id="registerNombre"
                                                    required
                                                >
                                            </div>

                                            <div class="col-md-6 mb-3">
                                                <label for="registerApellido" class="form-label">
                                                    Apellido
                                                </label>

                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    id="registerApellido"
                                                    required
                                                >
                                            </div>

                                        </div>

                                        <div class="mb-3">
                                            <label for="registerEmail" class="form-label">
                                                Correo electrónico
                                            </label>

                                            <input
                                                type="email"
                                                class="form-control"
                                                id="registerEmail"
                                                required
                                            >
                                        </div>

                                        <div class="mb-3">
                                            <label for="registerPassword" class="form-label">
                                                Contraseña
                                            </label>

                                            <input
                                                type="password"
                                                class="form-control"
                                                id="registerPassword"
                                                required
                                            >
                                        </div>

                                        <div class="mb-3">
                                            <label for="registerPasswordConfirm" class="form-label">
                                                Confirmar contraseña
                                            </label>

                                            <input
                                                type="password"
                                                class="form-control"
                                                id="registerPasswordConfirm"
                                                required
                                            >
                                        </div>

                                        <button
                                            type="submit"
                                            class="btn btn-primary w-100"
                                        >
                                            Crear cuenta
                                        </button>

                                    </form>

                                </div>

                            </div>

                            <!-- Mensajes -->
                            <div
                                id="authMessage"
                                class="alert d-none mt-4 mb-0"
                                role="alert"
                            ></div>

                        </div>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="mt-auto">
        <div class="container py-4">
            <div class="text-center">
                <p class="mb-0">
                    © 2026 Xentro Tecno. Todos los derechos reservados.
                </p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/base.js"></script>
    <script type="module" src="js/auth.js"></script>

</body>

</html>
